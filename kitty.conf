# BEGIN_KITTY_THEME
# Gruvbox Dark
include current-theme.conf
# END_KITTY_THEME

# Cursor Animation
cursor_shape     block
cursor_trail     1
enable_audio_bell no

# Font configuration
window_padding_width 18
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 16.5

# minimal tab bar
tab_bar_edge         bottom
tab_bar_style        powerline
tab_powerline_style  slanted
tab_title_template   {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}

# Background opacity (0.0 is fully transparent, 1.0 is fully opaque)
background_opacity 0.7
background_blur 20

hide_window_decorations yes

# Layout
enabled_layouts      splits, stack

# Sidebar
map cmd+d            launch --location=vsplit --cwd=current
map cmd+b            launch --location=hsplit --cwd=current
map cmd+w      close_window

# Navigate splits
map cmd+h         neighboring_window left
map cmd+l        neighboring_window right
map cmd+j         neighboring_window down
map cmd+k         neighboring_window up

# Navigate splits
map cmd+right         neighboring_window right
map cmd+left        neighboring_window left
map cmd+up         neighboring_window up
map cmd+down         neighboring_window down

# Resize sidebar
map cmd+shift+l   resize_window narrower 2
map cmd+shift+h  resize_window wider 2
map cmd+shift+k    resize_window taller 2
map cmd+shift+j  resize_window shorter 2

# Resize sidebar with arrow
map cmd+shift+right   resize_window narrower 2
map cmd+shift+left  resize_window wider 5
map cmd+shift+up   resize_window taller 5
map cmd+shift+down  resize_window shorter 5
